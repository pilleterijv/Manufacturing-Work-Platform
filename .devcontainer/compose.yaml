services:
  app:
    image: node:24-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/Manufacturing-Work-Platform:cached
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: work_rebuild
      POSTGRES_USER: work
      POSTGRES_PASSWORD: work
    volumes:
      - codespaces_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U work -d work_rebuild"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  codespaces_data:
